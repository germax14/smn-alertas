name: Actualizar Placas SMN

on:
  schedule:
    # Se ejecuta cada 3 horas
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  generar-placas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow matplotlib shapely geopandas contextily

      - name: Instalar fuentes tipograficas
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-freefont-ttf

      - name: Ejecutar generacion de placas
        run: python placas.py

      - name: Subir placas actualizadas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f placas_mapa/
          if git diff --staged --quiet; then
            echo "No hubo cambios en los archivos."
          else
            git commit -m "Auto: actualizacion de placas SMN via JSON [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
